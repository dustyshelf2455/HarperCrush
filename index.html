<!doctype html>

    <title>Glimmerfall</title>
    <style>
      html, body { margin: 0; background: #070a16; color: #e9ecff; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 430px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 48px) 20px calc(env(safe-area-inset-bottom, 0px) + 40px); }

      a.cta { display: block; margin-top: 28px; padding: 18px 20px; border-radius: 16px; background: #ffd27a; color: #2a1a05; text-decoration: none; font-weight: 600; font-size: 18px; text-align: center; }
      .gem { width: 72px; height: 72px; margin-bottom: 20px; }

  </head>
  <body>
    <main>
      <svg class="gem" viewBox="-1.2 -1.2 2.4 2.4" aria-hidden="true">
        <defs>
          <radialGradient id="g" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffe9a8"/><stop offset="0.45" stop-color="#ffc84a"/><stop offset="1" stop-color="#8a5a10"/></radialGradient>

      <h1>Glimmerfall</h1>
      <p>A calm, wonder-filled match-3 game for Harper. The game itself will live at this address. For now, this site carries the Stage 1 mockups: three visual directions and three music sketches to choose from.</p>
      <a class="cta" href="./mockups/">Open the mockups</a>
